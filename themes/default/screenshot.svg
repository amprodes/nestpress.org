  <!-- Theme Label -->
  <rect x="600" y="560" width="180" height="30" rx="4" fill="#2563eb"/>
  <text x="690" y="580" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">NestPress Default</text>
</svg>
