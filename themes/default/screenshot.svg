<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="defaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Header -->
  <rect width="800" height="70" fill="#ffffff"/>
  <rect x="40" y="25" width="120" height="20" rx="4" fill="#1e293b"/>
  <rect x="580" y="25" width="50" height="20" rx="4" fill="#64748b"/>
  <rect x="650" y="25" width="50" height="20" rx="4" fill="#64748b"/>
  <rect x="720" y="25" width="50" height="20" rx="4" fill="#64748b"/>
  <rect width="800" height="1" y="69" fill="#e2e8f0"/>
  
  <!-- Hero Section -->
  <rect y="70" width="800" height="250" fill="url(#defaultGrad)"/>
  <rect x="40" y="130" width="350" height="40" rx="4" fill="rgba(255,255,255,0.9)"/>
  <rect x="40" y="185" width="280" height="20" rx="4" fill="rgba(255,255,255,0.6)"/>
  <rect x="40" y="215" width="320" height="16" rx="4" fill="rgba(255,255,255,0.4)"/>
  <rect x="40" y="260" width="120" height="40" rx="20" fill="#ffffff"/>
  
  <!-- Content Cards -->
  <rect x="40" y="350" width="230" height="200" rx="8" fill="#f9fafb" stroke="#e2e8f0"/>
  <rect x="55" y="365" width="200" height="100" rx="4" fill="#e2e8f0"/>
  <rect x="55" y="480" width="150" height="16" rx="4" fill="#1e293b"/>
  <rect x="55" y="505" width="180" height="12" rx="4" fill="#64748b"/>
  
  <rect x="285" y="350" width="230" height="200" rx="8" fill="#f9fafb" stroke="#e2e8f0"/>
  <rect x="300" y="365" width="200" height="100" rx="4" fill="#e2e8f0"/>
  <rect x="300" y="480" width="150" height="16" rx="4" fill="#1e293b"/>
  <rect x="300" y="505" width="180" height="12" rx="4" fill="#64748b"/>
  
  <rect x="530" y="350" width="230" height="200" rx="8" fill="#f9fafb" stroke="#e2e8f0"/>
  <rect x="545" y="365" width="200" height="100" rx="4" fill="#e2e8f0"/>
  <rect x="545" y="480" width="150" height="16" rx="4" fill="#1e293b"/>
