<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="creativeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f7c948;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Dark Background -->
  <rect width="800" height="600" fill="#0f0f1a"/>
  
  <!-- Header -->
  <rect width="800" height="70" fill="transparent"/>
  <rect x="40" y="25" width="100" height="20" rx="4" fill="#ffffff"/>
  <circle cx="60" cy="35" r="5" fill="#ff6b35"/>
  <rect x="520" y="25" width="50" height="20" rx="4" fill="rgba(255,255,255,0.5)"/>
  <rect x="590" y="25" width="50" height="20" rx="4" fill="rgba(255,255,255,0.5)"/>
  <rect x="660" y="25" width="50" height="20" rx="4" fill="rgba(255,255,255,0.5)"/>
  <rect x="730" y="20" width="40" height="30" rx="4" fill="#ff6b35"/>
  
  <!-- Hero Section -->
  <rect x="40" y="100" width="450" height="70" rx="4" fill="#ffffff"/>
  <rect x="40" y="185" width="380" height="30" rx="4" fill="rgba(255,255,255,0.6)"/>
  <rect x="40" y="230" width="300" height="20" rx="4" fill="rgba(255,255,255,0.3)"/>
  <rect x="40" y="280" width="140" height="50" rx="25" fill="url(#creativeGrad)"/>
  
  <!-- Decorative Elements -->
  <circle cx="650" cy="200" r="120" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
  <circle cx="700" cy="180" r="80" fill="none" stroke="#f7c948" stroke-width="2" opacity="0.3"/>
  <circle cx="620" cy="250" r="40" fill="#ff6b35" opacity="0.2"/>
  
  <!-- Portfolio Grid -->
  <rect y="360" width="800" height="240" fill="#1a1a2e"/>
  <rect x="40" y="380" width="170" height="140" rx="8" fill="#2a2a3e"/>
  <rect x="50" y="390" width="150" height="90" rx="4" fill="url(#creativeGrad)" opacity="0.8"/>
  <rect x="50" y="495" width="100" height="14" rx="4" fill="#ffffff"/>
  
  <rect x="225" y="380" width="170" height="140" rx="8" fill="#2a2a3e"/>
  <rect x="235" y="390" width="150" height="90" rx="4" fill="#ff6b35" opacity="0.8"/>
  <rect x="235" y="495" width="100" height="14" rx="4" fill="#ffffff"/>
  
  <rect x="410" y="380" width="170" height="140" rx="8" fill="#2a2a3e"/>
  <rect x="420" y="390" width="150" height="90" rx="4" fill="#f7c948" opacity="0.8"/>
  <rect x="420" y="495" width="100" height="14" rx="4" fill="#ffffff"/>
  
  <rect x="595" y="380" width="170" height="140" rx="8" fill="#2a2a3e"/>
  <rect x="605" y="390" width="150" height="90" rx="4" fill="url(#creativeGrad)" opacity="0.8"/>
  <rect x="605" y="495" width="100" height="14" rx="4" fill="#ffffff"/>
  
  <!-- Theme Label -->
  <rect x="600" y="555" width="180" height="30" rx="4" fill="#ff6b35"/>
  <text x="690" y="575" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Creative Agency</text>
</svg>
