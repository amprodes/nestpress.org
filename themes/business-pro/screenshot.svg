<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="businessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Header -->
  <rect width="800" height="70" fill="#1e3a5f"/>
  <rect x="40" y="25" width="140" height="20" rx="4" fill="#ffffff"/>
  <rect x="520" y="25" width="60" height="20" rx="4" fill="rgba(255,255,255,0.7)"/>
  <rect x="600" y="25" width="60" height="20" rx="4" fill="rgba(255,255,255,0.7)"/>
  <rect x="680" y="25" width="80" height="20" rx="4" fill="#f4a261"/>
  
  <!-- Hero Section -->
  <rect y="70" width="800" height="280" fill="url(#businessGrad)"/>
  <rect x="40" y="120" width="400" height="50" rx="4" fill="rgba(255,255,255,0.95)"/>
  <rect x="40" y="185" width="320" height="20" rx="4" fill="rgba(255,255,255,0.7)"/>
  <rect x="40" y="215" width="280" height="16" rx="4" fill="rgba(255,255,255,0.5)"/>
  <rect x="40" y="270" width="140" height="45" rx="4" fill="#f4a261"/>
  <rect x="200" y="270" width="140" height="45" rx="4" fill="transparent" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Stats Bar -->
  <rect y="350" width="800" height="80" fill="#f8f9fa"/>
  <rect x="80" y="370" width="100" height="30" rx="4" fill="#1e3a5f"/>
  <rect x="260" y="370" width="100" height="30" rx="4" fill="#1e3a5f"/>
  <rect x="440" y="370" width="100" height="30" rx="4" fill="#1e3a5f"/>
  <rect x="620" y="370" width="100" height="30" rx="4" fill="#1e3a5f"/>
  
  <!-- Service Cards -->
  <rect x="40" y="450" width="170" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="125" cy="490" r="25" fill="#f4a261"/>
  <rect x="70" y="530" width="110" height="14" rx="4" fill="#1a1a2e"/>
  <rect x="55" y="550" width="140" height="10" rx="4" fill="#6c757d"/>
  
  <rect x="225" y="450" width="170" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="310" cy="490" r="25" fill="#2ec4b6"/>
  <rect x="255" y="530" width="110" height="14" rx="4" fill="#1a1a2e"/>
  <rect x="240" y="550" width="140" height="10" rx="4" fill="#6c757d"/>
  
  <rect x="410" y="450" width="170" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="495" cy="490" r="25" fill="#1e3a5f"/>
  <rect x="440" y="530" width="110" height="14" rx="4" fill="#1a1a2e"/>
  <rect x="425" y="550" width="140" height="10" rx="4" fill="#6c757d"/>
  
  <rect x="595" y="450" width="170" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="680" cy="490" r="25" fill="#f4a261"/>
  <rect x="625" y="530" width="110" height="14" rx="4" fill="#1a1a2e"/>
  <rect x="610" y="550" width="140" height="10" rx="4" fill="#6c757d"/>
  
  <!-- Theme Label -->
  <rect x="610" y="560" width="170" height="30" rx="4" fill="#1e3a5f"/>
  <text x="695" y="580" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Business Pro</text>
</svg>
